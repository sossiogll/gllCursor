name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  react:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  angular1:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: angular1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm pack --dry-run
